<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <!-- Incidental host-only UI fonts are not part of Axolotl or distributable CI. -->
  <selectfont><rejectfont><glob>/usr/share/fonts/openai-sans/*</glob></rejectfont></selectfont>
</fontconfig>
