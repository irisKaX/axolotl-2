<html lang="cs" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <meta name="color-scheme" content="dark light">
    <title>Axolotl 2.0</title>
    <link rel="stylesheet" href="./assets/cursor-effects.css">
    <link rel="stylesheet" href="./assets/navigation.css">
    <script src="./assets/cursor-effects.js" defer></script>
    <script src="./assets/navigation.js" defer></script>
    <script>
      // Apply the saved theme before the page is painted. Dark is the default.
      try {
        if (localStorage.getItem('axolotl-2-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch {
        // The switch also works when browser storage is unavailable.
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --background:
          radial-gradient(ellipse at 42% 5%, #383838 0%, transparent 58%),
          radial-gradient(ellipse at 95% 85%, #222222 0%, transparent 50%),
          #050505;
        --foreground: #fff;
        --axolotl-settings-surface: #303136;
        --axolotl-settings-accent-start: #8983f7;
        --axolotl-settings-accent-end: #a3dafb;
        --axolotl-settings-border: rgba(255, 255, 255, .10);
        --axolotl-settings-shadow: 0 14px 40px rgba(0, 0, 0, .22);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --background:
          radial-gradient(ellipse at 42% 5%, #D0D0D0 0%, transparent 58%),
          radial-gradient(ellipse at 95% 85%, #E2E2E2 0%, transparent 50%),
          #FAFAFA;
        --foreground: #000;
        --axolotl-settings-surface: #f4f4f5;
        --axolotl-settings-accent-start: #ff0080;
        --axolotl-settings-accent-end: #ff8c00;
        --axolotl-settings-border: rgba(0, 0, 0, .10);
        --axolotl-settings-shadow: 0 14px 40px rgba(0, 0, 0, .10);
      }

      * { box-sizing: border-box; }

      html, body {
        min-height: 100%;
        margin: 0;
        background: var(--background);
        color: var(--foreground);
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .axolotl-controls {
        position: fixed;
        z-index: 10;
        top: calc(20px + env(safe-area-inset-top, 0px));
        right: calc(20px + env(safe-area-inset-right, 0px));
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .axolotl-clock {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
        margin-right: 8px;
        color: var(--foreground);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .axolotl-clock-time {
        font-size: 17px;
        font-weight: 600;
        line-height: 18px;
        letter-spacing: .02em;
      }

      .axolotl-clock-date {
        font-size: 12px;
        line-height: 14px;
        opacity: .65;
      }

      .axolotl-settings-trigger,
      .axolotl-notifications-trigger {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--axolotl-settings-surface);
        transition: background-color .4s;
        color: var(--foreground);
        cursor: pointer;
        touch-action: manipulation;
      }

      .axolotl-notifications-trigger:disabled { cursor: default; }
      .axolotl-notifications-trigger .axolotl-settings-icon {
        width: 20px;
        height: 20px;
        stroke: url(#axolotl-settings-gear-gradient);
      }

      @media (max-width: 380px) {
        .axolotl-controls { gap: 8px; }
        .axolotl-clock { margin-right: 0; }
        .axolotl-clock-date { font-size: 11px; }
      }

      @media (hover: hover) {
        .axolotl-settings-trigger:hover .axolotl-settings-icon {
          transform: rotate(25deg);
        }
      }

      .axolotl-settings-trigger[aria-expanded="true"] .axolotl-settings-icon {
        transform: rotate(60deg);
      }

      .axolotl-settings-trigger:focus-visible {
        outline: 2px solid var(--foreground);
        outline-offset: 3px;
      }

      .axolotl-settings-icon {
        display: block;
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .axolotl-settings-trigger .axolotl-settings-icon {
        width: 22.4px;
        height: 22.4px;
        stroke: url(#axolotl-settings-gear-gradient);
        stroke-width: 1.9;
        transition: transform .4s;
      }

      .axolotl-settings-panel {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        width: min(280px, calc(100vw - 40px - env(safe-area-inset-right, 0px)));
        max-height: calc(100dvh - 88px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
        overflow-y: auto;
        padding: 8px;
        border: 0;
        border-radius: 24px;
        background: var(--axolotl-settings-surface);
        box-shadow: var(--axolotl-settings-shadow);
      }

      .axolotl-settings-panel[hidden] { display: none; }

      /* Bridge the gap so the pointer can travel from the gear into the panel. */
      .axolotl-settings[data-axolotl-open="true"]::after {
        content: "";
        position: absolute;
        top: 100%;
        right: 0;
        width: min(280px, calc(100vw - 40px - env(safe-area-inset-right, 0px)));
        height: 10px;
      }

      .axolotl-settings-heading {
        margin: 0;
        padding: 12px 12px 10px;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
      }

      .axolotl-settings-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .axolotl-settings-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 42px;
        padding: 10px 12px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--foreground);
        font: inherit;
        font-size: 14px;
        line-height: 1.4;
        text-align: left;
        opacity: .78;
        cursor: default;
      }

      .axolotl-settings-list li:last-child {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--axolotl-settings-border);
      }

      .axolotl-theme-control {
        --axolotl-theme-width: 3.5em;
        --axolotl-theme-height: 2em;
        --axolotl-theme-icon-size: 1.4em;
        --axolotl-theme-icon-offset: 0.3em;
        display: block;
        position: relative;
        width: var(--axolotl-theme-width);
        height: var(--axolotl-theme-height);
        font-size: 16px;
        touch-action: manipulation;
      }

      .axolotl-theme-input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .axolotl-theme-track {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #f4f4f5;
        transition: .4s;
        border-radius: 30px;
      }

      .axolotl-theme-track::before {
        position: absolute;
        content: "";
        height: var(--axolotl-theme-icon-size, 1.4em);
        width: var(--axolotl-theme-icon-size, 1.4em);
        border-radius: 20px;
        left: var(--axolotl-theme-icon-offset, 0.3em);
        top: 50%;
        transform: translateY(-50%);
        background: linear-gradient(40deg, #ff0080, #ff8c00 70%);
        transition: .4s;
      }

      .axolotl-theme-input:checked + .axolotl-theme-track {
        background-color: #303136;
      }

      .axolotl-theme-input:checked + .axolotl-theme-track::before {
        left: calc(100% - (var(--axolotl-theme-icon-size, 1.4em) + var(--axolotl-theme-icon-offset, 0.3em)));
        background: #303136;
        box-shadow: inset -3px -2px 5px -2px #8983f7, inset -10px -4px 0 0 #a3dafb;
      }

      .axolotl-theme-input:focus-visible + .axolotl-theme-track {
        outline: 2px solid var(--foreground);
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        .axolotl-theme-track,
        .axolotl-theme-track::before,
        .axolotl-settings-trigger,
        .axolotl-settings-trigger .axolotl-settings-icon { transition: none; }
      }
    </style>

      <section class="axolotl-view" id="axolotl-view-dashboard" data-axolotl-route="dashboard" aria-label="Dashboard"></section>
      <section class="axolotl-view" id="axolotl-view-media-konvertor-obrazku" data-axolotl-route="media/konvertor-obrazku" aria-label="Konvertor obrázků" hidden></section>
      <section class="axolotl-view" id="axolotl-view-media-obrazky-z-webu" data-axolotl-route="media/obrazky-z-webu" aria-label="Obrázky z webu" hidden></section>
      <section class="axolotl-view" id="axolotl-view-media-pdf-scout" data-axolotl-route="media/pdf-scout" aria-label="PDF scout" hidden></section>
      <section class="axolotl-view" id="axolotl-view-media-screenshot" data-axolotl-route="media/screenshot" aria-label="Screenshot" hidden></section>
      <section class="axolotl-view" id="axolotl-view-media-qr" data-axolotl-route="media/qr" aria-label="QR" hidden></section>
      <section class="axolotl-view" id="axolotl-view-kontrola-metadata" data-axolotl-route="kontrola/metadata" aria-label="Metadata" hidden></section>
      <section class="axolotl-view" id="axolotl-view-kontrola-nadpisy" data-axolotl-route="kontrola/nadpisy" aria-label="Nadpisy" hidden></section>
      <section class="axolotl-view" id="axolotl-view-kontrola-strukturovana-data" data-axolotl-route="kontrola/strukturovana-data" aria-label="Strukturovaná data" hidden></section>
      <section class="axolotl-view" id="axolotl-view-kontrola-obrazky" data-axolotl-route="kontrola/obrazky" aria-label="Obrázky" hidden></section>
      <section class="axolotl-view" id="axolotl-view-kontrola-hledani-na-webu" data-axolotl-route="kontrola/hledani-na-webu" aria-label="Hledání na webu" hidden></section>
      <section class="axolotl-view" id="axolotl-view-osobni-poznamky" data-axolotl-route="osobni-prostor/poznamky" aria-label="Poznámky" hidden></section>
    </main>
    <script>
      const root = document.documentElement;
      const toggle = document.getElementById('axolotl-theme-toggle');
      const control = document.querySelector('.axolotl-theme-control');
      const themeColor = document.querySelector('meta[name="theme-color"]');

      function updateThemeControl() {
        const isLight = root.dataset.theme === 'light';
        toggle.checked = !isLight;
        control.title = isLight ? 'Přepnout na tmavý režim' : 'Přepnout na světlý režim';
        themeColor.content = isLight ? '#fafafa' : '#050505';
      }

      toggle.addEventListener('change', () => {
        root.dataset.theme = toggle.checked ? 'dark' : 'light';
        updateThemeControl();
        try {
          localStorage.setItem('axolotl-2-theme', root.dataset.theme);
        } catch {
          // Storage is optional; the current theme still changes.
        }
      });

      updateThemeControl();

      const clock = document.getElementById('axolotl-clock');
      const clockTime = document.getElementById('axolotl-clock-time');
      const clockDate = document.getElementById('axolotl-clock-date');
      const clockTimeFormat = new Intl.DateTimeFormat('cs-CZ', {
        timeZone: 'Europe/Prague',
        hour: '2-digit',
        minute: '2-digit',
        hourCycle: 'h23'
      });
      const clockDateFormat = new Intl.DateTimeFormat('cs-CZ', {
        timeZone: 'Europe/Prague',
        weekday: 'long',
        day: 'numeric',
        month: 'numeric',
        year: 'numeric'
      });

      function updateClock() {
        const now = new Date();
        const time = clockTimeFormat.format(now);
        const date = clockDateFormat.format(now);
        clock.dateTime = now.toISOString();
        if (clockTime.textContent !== time) clockTime.textContent = time;
        if (clockDate.textContent !== date) clockDate.textContent = date;
      }

      updateClock();
      setInterval(updateClock, 1000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) updateClock();
      });

      const settings = document.querySelector('.axolotl-settings');
      const settingsToggle = document.getElementById('axolotl-settings-toggle');
      const settingsPanel = document.getElementById('axolotl-settings-panel');
      const settingsHome = document.getElementById('axolotl-settings-home');
      const appearancePanel = document.getElementById('axolotl-appearance-panel');
      const appearanceOpen = document.getElementById('axolotl-appearance-open');
      const appearanceBack = document.getElementById('axolotl-appearance-back');
      const settingsHoverPointer = matchMedia('(hover: hover) and (pointer: fine)');
      let settingsCloseTimer;
      let settingsOpenedByHover = false;

      function showSettingsHome(returnFocus = false) {
        settingsHome.hidden = false;
        appearancePanel.hidden = true;
        if (returnFocus) appearanceOpen.focus();
      }

      function showAppearance(moveFocus = true) {
        const restoreFocus = moveFocus || settingsHome.contains(document.activeElement);
        settingsHome.hidden = true;
        appearancePanel.hidden = false;
        if (restoreFocus) appearanceBack.focus();
      }

      appearanceOpen.addEventListener('click', () => showAppearance());
      appearanceOpen.addEventListener('pointerenter', event => {
        if (event.pointerType === 'mouse' && settingsHoverPointer.matches) showAppearance(false);
      });

      appearanceBack.addEventListener('click', () => showSettingsHome(true));
      appearanceBack.addEventListener('pointerenter', event => {
        if (event.pointerType === 'mouse' && settingsHoverPointer.matches) {
          showSettingsHome(appearancePanel.contains(document.activeElement));
        }
      });

      function setSettingsOpen(open, returnFocus = false) {
        clearTimeout(settingsCloseTimer);
        const wasOpen = !settingsPanel.hidden;
        settingsToggle.setAttribute('aria-expanded', String(open));
        settings.dataset.axolotlOpen = String(open);
        settingsPanel.hidden = !open;
        if (!open) {
          settingsOpenedByHover = false;
          showSettingsHome();
        } else if (!wasOpen) {
          document.dispatchEvent(new Event('axolotl:settings-open'));
        }
        if (returnFocus) settingsToggle.focus();
      }

      document.addEventListener('axolotl:navigation-open', () => setSettingsOpen(false));

      settings.addEventListener('pointerenter', event => {
        if (event.pointerType !== 'mouse' || !settingsHoverPointer.matches) return;
        clearTimeout(settingsCloseTimer);
        if (settingsPanel.hidden) {
          settingsOpenedByHover = true;
          setSettingsOpen(true);
        }
      });

      settings.addEventListener('pointerleave', () => {
        settingsCloseTimer = setTimeout(() => {
          if (!settingsPanel.contains(document.activeElement)) setSettingsOpen(false);
        }, 150);
      });

      settingsToggle.addEventListener('click', () => {
        if (!settingsPanel.hidden && settingsOpenedByHover) {
          settingsOpenedByHover = false;
        } else {
          setSettingsOpen(settingsPanel.hidden);
        }
      });

      document.addEventListener('pointerdown', (event) => {
        if (!settings.contains(event.target)) setSettingsOpen(false);
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !settingsPanel.hidden) {
          event.preventDefault();
          setSettingsOpen(false, true);
        }
      });

      settings.addEventListener('focusout', () => {
        // Wait until the new settings view has received focus before checking it.
        setTimeout(() => {
          if (!settings.contains(document.activeElement)) setSettingsOpen(false);
        }, 0);
      });
    </script>
  </body>
</html>
