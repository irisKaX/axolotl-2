<!doctype html>
<html lang="cs" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark light" />
    <title>Axolotl 2.0</title>
    <script>
      // Set the saved theme before styles paint; React takes ownership on startup.
      try {
        const saved = localStorage.getItem("axolotl-2-theme");
        document.documentElement.dataset.theme =
          saved === "light" ||
          (saved === "system" &&
            !matchMedia("(prefers-color-scheme: dark)").matches)
            ? "light"
            : "dark";
      } catch {}
    </script>
    <script type="module" crossorigin src="/axolotl-2/assets/app-CuViInit.js"></script>
    <link rel="modulepreload" crossorigin href="/axolotl-2/assets/rolldown-runtime-pP25SEvz.js">
    <link rel="modulepreload" crossorigin href="/axolotl-2/assets/jsx-runtime-ChORm44H.js">
    <link rel="stylesheet" crossorigin href="/axolotl-2/assets/app-DZ957km_.css">
  </head>
  <body>
    <div id="axolotl-root"></div>
    <noscript>Pro používání Axolotlu zapni JavaScript.</noscript>
  </body>
</html>
