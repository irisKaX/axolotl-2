<!doctype html>
<html lang="cs" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark light">
    <title>Axolotl 2.0</title>
    <script>
      // Apply the saved theme before the page is painted. Dark is the default.
      try {
        if (localStorage.getItem('axolotl-2-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch {
        // The switch also works when browser storage is unavailable.
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --background: #000;
        --foreground: #fff;
        --button-background: #111;
        --button-hover: #222;
        --button-border: #444;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --background: #fff;
        --foreground: #000;
        --button-background: #fff;
        --button-hover: #eee;
        --button-border: #bbb;
      }

      * { box-sizing: border-box; }

      html, body {
        min-height: 100%;
        margin: 0;
        background: var(--background);
        color: var(--foreground);
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .theme-toggle {
        position: fixed;
        top: calc(20px + env(safe-area-inset-top, 0px));
        right: calc(20px + env(safe-area-inset-right, 0px));
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid var(--button-border);
        border-radius: 999px;
        background: var(--button-background);
        color: var(--foreground);
        font: inherit;
        font-size: 14px;
        line-height: 1.4;
        cursor: pointer;
        touch-action: manipulation;
      }

      @media (hover: hover) {
        .theme-toggle:hover { background: var(--button-hover); }
      }

      .theme-toggle:focus-visible {
        outline: 2px solid var(--foreground);
        outline-offset: 4px;
      }

      .theme-toggle svg { width: 18px; height: 18px; }
      .icon-moon { display: none; }
      [data-theme="light"] .icon-sun { display: none; }
      [data-theme="light"] .icon-moon { display: block; }
    </style>
  </head>
  <body>
    <button class="theme-toggle" type="button" aria-label="Přepnout na světlý režim" title="Přepnout na světlý režim">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"></path>
      </svg>
      <span class="theme-label">Light mode</span>
    </button>
    <script>
      const root = document.documentElement;
      const toggle = document.querySelector('.theme-toggle');
      const label = document.querySelector('.theme-label');
      const themeColor = document.querySelector('meta[name="theme-color"]');

      function updateThemeControl() {
        const isLight = root.dataset.theme === 'light';
        const action = isLight ? 'Přepnout na tmavý režim' : 'Přepnout na světlý režim';
        label.textContent = isLight ? 'Dark mode' : 'Light mode';
        toggle.setAttribute('aria-label', action);
        toggle.title = action;
        themeColor.content = isLight ? '#ffffff' : '#000000';
      }

      toggle.addEventListener('click', () => {
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        updateThemeControl();
        try {
          localStorage.setItem('axolotl-2-theme', root.dataset.theme);
        } catch {
          // Storage is optional; the current theme still changes.
        }
      });

      updateThemeControl();
    </script>
  </body>
</html>
