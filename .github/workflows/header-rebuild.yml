name: Isolated header verification
on:
  push:
    branches: [feat/header-rebuild-isolated]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:header
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:header:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: header-rebuild-browser-evidence
          path: |
            test-results/
            docs/header-rebuild/screenshots/
            docs/header-rebuild/select-screenshots/
          retention-days: 14
