name: Layout Studio isolated verification
on:
  push:
    branches: [experiment/ds-library-v1-1]
    paths:
      - 'src/pages/design-system/library/layout/**'
      - 'src/pages/design-system/library/LayoutPage.tsx'
      - 'scripts/ds-library/check-layout.mjs'
      - '.github/workflows/layout-studio-check.yml'
permissions:
  contents: read
concurrency:
  group: layout-studio-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.ref == 'refs/heads/experiment/ds-library-v1-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify production boundary
        run: |
          git fetch --depth=1 origin fbdd839acc9ccd150d2c63e7af336a975e0d177c
          git diff --exit-code fbdd839acc9ccd150d2c63e7af336a975e0d177c HEAD -- src/app src/components src/tools src/styles src/design-system package.json package-lock.json vite.config.ts
      - run: npm test
      - run: node scripts/ds-library/build.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ds-library/check-built.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-studio-review
          path: docs/ds-library/evidence/
          retention-days: 14
