name: Axolotl build and deploy
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: axolotl-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:legacy
      - run: npm run test:tools
      - run: npm run build
      # GitHub Pages deploys the freshly built dist artifact below.
      - name: Install browser engines for application regression
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Check integrated application in Chromium, WebKit and Firefox
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-browser-check
          path: test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy tested build
        id: deployment
        uses: actions/deploy-pages@v4
