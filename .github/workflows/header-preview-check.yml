name: Public isolated header smoke
on:
  push:
    branches: [feat/header-rebuild-isolated]
    paths:
      - '.github/workflows/header-preview-check.yml'
      - 'scripts/header-rebuild/check-public.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check deployed preview and preserved labs
        env:
          EXPECTED_HEADER_SHA: 011ecc3ac587145317f87a54efd6974b2205ad19
        run: node scripts/header-rebuild/check-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-header-smoke
          path: test-results/public/
