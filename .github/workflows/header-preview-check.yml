name: Public isolated header smoke
on:
  push:
    branches: [feat/header-rebuild-isolated]
    paths:
      - '.github/workflows/header-preview-check.yml'
      - 'scripts/header-rebuild/check-public.mjs'
      - 'src/app/header/**'
      - 'src/pages/header-rebuild/**'
      - 'vite.header-rebuild.config.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check deployed preview and preserved labs
        env:
          EXPECTED_HEADER_SHA: ${{ github.sha }}
        run: node scripts/header-rebuild/check-public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-header-smoke
          path: test-results/public/
